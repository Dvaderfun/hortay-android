# 8 GB dev Mac memory model: small Gradle daemon + dedicated Kotlin daemon.
# The Kotlin/Native release link is the peak consumer — it runs in the Kotlin
# daemon with its own heap (kotlin.daemon.jvmargs) instead of sharing one big
# in-process heap with Gradle (the old -Xmx6g + in-process setup got the
# daemon OOM-killed by macOS and the K/N 2.4 release link hit GC-overhead).
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# CSAE-compliance: child safety and privacy policy URLs. Surfaced in Settings →
# Safety and compiled into BuildConfig.CHILD_SAFETY_POLICY_URL / PRIVACY_POLICY_URL.
# Update these when the hosted pages move without touching the build script.
HORTAY_VERSION_NAME=0.6.0

HORTAY_CHILD_SAFETY_POLICY_URL=https://telegra.ph/Child-Safety-Standards-05-12
HORTAY_PRIVACY_POLICY_URL=https://telegra.ph/Privacy-Policy--Hortay-05-01
